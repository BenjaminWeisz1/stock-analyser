<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Corion Capital</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Login and signup -->
    <div id="login-view">
        <h2>Authentication</h2>
        <input id="email-input" placeholder="Email">
        <input id="password-input" type="password" placeholder="Password">
        <button id="login-btn">Login</button>
        <button id="register-btn">Register</button>
        <p id="auth-message"></p>
    </div>

    <!-- List stocks -->
    <div id="dashboard-view" style="display:none">
        <h2>Select Stock</h2>
        <select id="stock-select">
            <option>AAPL</option>
            <option>GOOG</option>
            <option>IBM</option>
            <option>MSFT</option>
            <option>NPXI</option>
            <option>PANW</option>
            <option>PYPL</option>
            <option>TSLA</option>
        </select>
        <input type="date" id="date-input">
        <button id="analyze-btn">Analyze</button>
    </div>

    <!-- Stock details -->
    <div id="stock-view" style="display:none">
        <h2 id="stock-title">IBM</h2>
        <pre id="result"></pre>
    </div>

    <!-- Load JS -->
    <script src="app.js"></script>
</body>
</html>
